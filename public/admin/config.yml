      - { name: date, label: 发布日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', default: '{{now}}' }
      - { name: description, label: 摘要, widget: text, required: false, hint: 一句话，用于搜索引擎与 RSS }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: updated, label: 更新日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: 勾选后不会发布；目录是草稿时，里面的页面也不发布 }
      - { name: order, label: 排序, widget: number, value_type: int, required: false, hint: 只对目录有效：在上级目录里数字小的排在前面，不填按日期 }
      - { name: body, label: 正文, widget: markdown, required: false, hint: 文章必填，目录可不填 }

  - name: theory
    label: 技术理论
    label_singular: 页面
    folder: src/content/theory
    path: '{{slug}}/index'
    # 目录树：kind 为「目录」的页面里可以再放目录或文章，网址即文件夹路径（见 src/content.config.ts）。
    # 新建时先在左侧进入目标目录，或在编辑页的上级文件夹里选；移动页面会改变它的网址
