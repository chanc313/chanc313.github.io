# Sveltia CMS 配置：后台有哪些栏目、每个栏目有哪些字段。
# 字段必须与 src/content.config.ts 中的定义一致；新增栏目时两处同步修改。

backend:
  name: github
  repo: chanc313/chanc313.github.io
  branch: main
  # GitHub 登录的授权服务（Sveltia CMS Authenticator，部署于 Cloudflare Workers）
  base_url: https://sveltia-cms-auth.hjchanc313.workers.dev
  # GitHub 登录授权范围：仅公开仓库（默认 repo 会包含全部私有仓库）。本仓库为公开仓库，public_repo 足够
  auth_scope: public_repo
  # 提交说明（出现在 GitHub 提交记录中）
  commit_messages:
    create: '新建 {{collection}}：{{slug}}'
    update: '更新 {{collection}}：{{slug}}'
    delete: '删除 {{collection}}：{{slug}}'
    uploadMedia: '上传 {{path}}'
    deleteMedia: '删除 {{path}}'

# 全站共用资源的上传位置（public/shared/，网址 /shared/）。
# 各集合把 media_folder 设为 ''，页面私有资源存进该页面自己的文件夹。
media_folder: public/shared
public_folder: /shared

# 页面文件夹名（即网址的最后一段）只允许英文字母、数字和连字符
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    # 文件夹名在新建时手动填写（英文或拼音），保存后不可改，避免网址变化
    slug:
      editable: [create]
    sortable_fields: [date, title]
    summary: '{{title}}（{{date}}）'
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 发布日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', default: '{{now}}' }
      - { name: description, label: 摘要, widget: text, required: false, hint: 一句话，用于搜索引擎与 RSS }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: updated, label: 更新日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: 勾选后不会发布 }
      - { name: ai, label: 对话对象, widget: string, required: false, hint: 仅对话记录填写，如 Claude Opus 5.5 }
      - { name: note, label: 批注, widget: text, required: false, hint: 显示在正文之前，如这段对话为什么值得留下 }
      - name: body
        label: 正文
        widget: markdown
        hint: 对话记录用单独一行的 @me 或 @ai 标记每段发言的开始

  - name: projects
    label: 项目
    label_singular: 项目
    folder: src/content/projects
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    sortable_fields: [date, title]
    summary: '{{title}}（{{date}}）'
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 发布日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', default: '{{now}}' }
      - { name: description, label: 摘要, widget: text, required: false, hint: 一句话，用于搜索引擎与 RSS }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: updated, label: 更新日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: 勾选后不会发布 }
      - { name: body, label: 正文, widget: markdown }

  - name: theory
    label: 技术理论
    label_singular: 笔记
    folder: src/content/theory
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    sortable_fields: [date, title]
    summary: '{{title}}（{{date}}）'
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 发布日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', default: '{{now}}' }
      - { name: description, label: 摘要, widget: text, required: false, hint: 一句话，用于搜索引擎与 RSS }
      - { name: tags, label: 标签, widget: list, required: false, default: [] }
      - { name: updated, label: 更新日期, widget: datetime, time_format: false, format: 'YYYY-MM-DD', required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false, hint: 勾选后不会发布 }
      - name: topic
        label: 话题
        widget: relation
        collection: topics
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
        required: false
        hint: 不选则列在「未归入话题」
      - { name: series, label: 系列, widget: string, required: false, hint: 必须与所选话题的「系列」列表中的一项完全一致；不属于系列就留空 }
      - { name: body, label: 正文, widget: markdown }

  # 技术理论的话题：网址为 /theory/<文件夹名>/，文件夹名不能与技术理论的文章重名
  - name: topics
    label: 技术理论话题
    label_singular: 话题
    folder: src/content/topics
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    sortable_fields: [order, title]
    summary: '{{title}}'
    fields:
      - { name: title, label: 名称, widget: string }
      - { name: description, label: 简介, widget: text, required: false, hint: 一句话，用于搜索引擎，页面上不显示 }
      - { name: order, label: 排序, widget: number, value_type: int, default: 0, required: false, hint: 数字小的排在前面 }
      - { name: series, label: 系列, widget: list, required: false, default: [], hint: 话题内的系列名，如 学习笔记；文章填同样的名字即归入该系列 }

  - name: pages
    label: 独立页面
    label_singular: 页面
    folder: src/content/pages
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    extension: md
    format: frontmatter
    create: true
    slug:
      editable: [create]
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: description, label: 摘要, widget: text, required: false }
      - { name: draft, label: 草稿, widget: boolean, default: false }
      - { name: body, label: 正文, widget: markdown }
